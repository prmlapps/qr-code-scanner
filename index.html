  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');

    :root {
      --bg:        #0a0a0a;
      --surface:   #111111;
      --border:    #222222;
      --accent:    #c8f05a;
      --accent2:   #5af0c8;
      --text:      #f0f0f0;
      --muted:     #666666;
      --danger:    #f05a5a;
      --radius:    16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 0;
      overflow-y: auto;
      gap: 16px;
    }

    /* ── Viewfinder ── */
    .viewfinder-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      overflow: hidden;
      background: #050505;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 28px; height: 28px;
      border-color: var(--accent);
      border-style: solid;
      z-index: 2;
    }
    .corner-tl { top: 14px; left: 14px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
    .corner-tr { top: 14px; right: 14px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
    .corner-bl { bottom: 14px; left: 14px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
    .corner-br { bottom: 14px; right: 14px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

    /* Scan line */
    .scan-line {
      position: absolute;
      left: 14px; right: 14px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      top: 14px;
      animation: scanline 2.5s ease-in-out infinite;
      z-index: 2;
      opacity: 0;
    }
    .scanning .scan-line { opacity: 1; }
    @keyframes scanline {
      0% { top: 14px; }
      50% { top: calc(100% - 14px); }
      100% { top: 14px; }
    }

    /* Success flash */
    .flash-overlay {
      position: absolute;
      inset: 0;
      background: var(--accent);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      border-radius: var(--radius);
      transition: opacity 0.05s;
    }
    .flash-overlay.flash { animation: flashAnim 0.4s ease forwards; }
    @keyframes flashAnim {
      0%   { opacity: 0.55; }
      100% { opacity: 0; }
    }

    /* Idle state overlay */
    .idle-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 4;
      background: rgba(10,10,10,0.85);
      transition: opacity 0.3s;
    }
    .idle-overlay.hidden { opacity: 0; pointer-events: none; }
    .idle-icon {
      width: 64px; height: 64px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .idle-icon svg { opacity: 0.5; }
    .idle-text {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
    }

    /* Viewfinder is tappable */
    .viewfinder-wrap { cursor: pointer; }
    .viewfinder-wrap:active { opacity: 0.92; }

    /* ── Controls ── (copy button only) */
    .btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
      outline: none;
      text-transform: uppercase;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent);
      color: #0a0a0a;
      border-color: var(--accent);
      font-weight: 500;
    }
    .btn-primary:hover { background: #d4f570; }
    .btn-secondary {
      background: transparent;
      color: var(--muted);
    }
    .btn-secondary:hover { border-color: #444; color: var(--text); }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    /* ── Result card ── */
    .result-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: none;
      flex-direction: column;
      gap: 14px;
      animation: slideUp 0.25s ease;
    }
    .result-card.visible { display: flex; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .result-content {
      font-size: 0.88rem;
      color: var(--text);
      word-break: break-all;
      line-height: 1.6;
      max-height: 110px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .result-content::-webkit-scrollbar { width: 3px; }
    .result-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* URL warning */
    .url-warning {
      display: none;
      align-items: flex-start;
      gap: 10px;
      background: #1a0f0f;
      border: 1px solid #3a1515;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.72rem;
      color: #e08080;
      line-height: 1.5;
    }
    .url-warning.visible { display: flex; }
    .url-warning svg { flex-shrink: 0; margin-top: 1px; }

    .result-actions {
      display: flex;
      gap: 8px;
    }
    .result-actions .btn { font-size: 0.72rem; padding: 10px 14px; }

    /* ── History ── */
    .history-wrap {
      width: 100%;
      padding-bottom: 24px;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .history-title {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .history-clear {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 6px;
    }
    .history-clear:hover { color: var(--danger); }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .history-item:hover { border-color: #333; }
    .history-item-text {
      flex: 1;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item-type {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent2);
      flex-shrink: 0;
    }
    .history-empty {
      font-size: 0.7rem;
      color: #333;
      text-align: center;
      padding: 16px 0;
      letter-spacing: 0.06em;
    }

    /* Viewfinder hide after scan */
    .viewfinder-wrap {
      transition: opacity 0.3s ease, max-height 0.4s ease, margin-bottom 0.4s ease;
      max-height: 600px;
    }
    .viewfinder-wrap.hidden-after-scan {
      opacity: 0;
      max-height: 0;
      margin-bottom: -16px; /* collapse the gap */
      pointer-events: none;
    }

    /* ── Status bar ── */
    #statusBar {
      width: 100%;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      padding: 4px 2px;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<main>
  <!-- Viewfinder -->
  <div class="viewfinder-wrap" id="viewfinderWrap">
    <video id="video" autoplay muted playsinline></video>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="scan-line" id="scanLine"></div>
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="idle-overlay" id="idleOverlay">
      <div class="idle-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f0f0f0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="3" height="3" rx="0.5"/><rect x="18" y="14" width="3" height="3" rx="0.5"/><rect x="14" y="18" width="3" height="3" rx="0.5"/><rect x="18" y="18" width="3" height="3" rx="0.5"/>
        </svg>
      </div>
      <div class="idle-text">Tap to scan<br>a QR code</div>
    </div>
  </div>

  <!-- Status -->
  <div id="statusBar">Ready</div>

  <!-- Result -->
  <div class="result-card" id="resultCard">
    <div class="result-label">Decoded content</div>
    <div class="result-content" id="resultContent"></div>
    <div class="url-warning" id="urlWarning">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span>This QR code contains a URL. Verify the address before opening it — QR codes can link to malicious sites.</span>
    </div>
    <div class="result-actions">
      <button class="btn btn-secondary" id="btnCopy">Copy</button>
      <button class="btn btn-primary" id="btnOpen" style="display:none">Open URL</button>
      <button class="btn btn-secondary" id="btnRescan">Scan again</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-wrap">
    <div class="history-header">
      <span class="history-title">Session history</span>
      <button class="history-clear" id="btnClearHistory">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty" id="historyEmpty">No scans yet</div>
    </div>
  </div>
</main>

<script>
(() => {
  // ── State ──
  let codeReader = null;
  let scanning   = false;
  let history    = [];
  let lastResult = '';

  const video          = document.getElementById('video');
  const btnCopy        = document.getElementById('btnCopy');
  const btnOpen        = document.getElementById('btnOpen');
  const btnRescan      = document.getElementById('btnRescan');
  const btnClearHistory = document.getElementById('btnClearHistory');
  const resultCard     = document.getElementById('resultCard');
  const resultContent  = document.getElementById('resultContent');
  const urlWarning     = document.getElementById('urlWarning');
  const historyList    = document.getElementById('historyList');
  const historyEmpty   = document.getElementById('historyEmpty');
  const idleOverlay    = document.getElementById('idleOverlay');
  const viewfinderWrap = document.getElementById('viewfinderWrap');
  const flashOverlay   = document.getElementById('flashOverlay');
  const statusBar      = document.getElementById('statusBar');

  // ── Utility ──
  function setStatus(msg) { statusBar.textContent = msg; }

  function isURL(str) {
    try { const u = new URL(str); return u.protocol === 'https:' || u.protocol === 'http:'; }
    catch { return false; }
  }

  function classify(str) {
    if (isURL(str)) return 'url';
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(str)) return 'email';
    if (/^[\+]?[\d\s\-().]{7,}$/.test(str)) return 'phone';
    return 'text';
  }

  function sanitizeDisplay(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ── Camera init (runs once on page load) ──
  let cachedDeviceId = null;
  let cachedStream   = null;

  async function initCamera() {
    try {
      // Request back camera by default; keep the stream alive for reuse
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }
      });
      cachedStream = stream;

      // Derive deviceId from the live track so we never need to ask again
      const track = stream.getVideoTracks()[0];
      cachedDeviceId = track.getSettings().deviceId ?? null;

      // Pause the tracks until the user taps to scan
      stream.getVideoTracks().forEach(t => { t.enabled = false; });

      if (!cachedDeviceId) setStatus('No camera found');
    } catch {
      setStatus('Camera permission denied');
    }
  }

  // ── Flash feedback ──
  function doFlash() {
    flashOverlay.classList.remove('flash');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('flash');
    try { if (navigator.vibrate) navigator.vibrate(40); } catch {}
  }

  // ── Show result ──
  function showResult(text) {
    const type = classify(text);
    resultContent.innerHTML = sanitizeDisplay(text);
    resultCard.classList.add('visible');

    // Stop camera and hide viewfinder
    stopScan(true);
    viewfinderWrap.classList.add('hidden-after-scan');

    if (type === 'url') {
      urlWarning.classList.add('visible');
      btnOpen.style.display = '';
      btnOpen.onclick = () => {
        if (confirm(`Open this URL?\n\n${text}\n\nOnly proceed if you trust the source.`)) {
          window.open(text, '_blank', 'noopener,noreferrer');
        }
      };
    } else {
      urlWarning.classList.remove('visible');
      btnOpen.style.display = 'none';
    }

    addHistory(text, type);
  }

  // ── Rescan ──
  function rescan() {
    resultCard.classList.remove('visible');
    urlWarning.classList.remove('visible');
    btnOpen.style.display = 'none';
    resultContent.innerHTML = '';
    viewfinderWrap.classList.remove('hidden-after-scan');
    startScan();
  }

  btnRescan.addEventListener('click', rescan);

  // ── Copy ──
  btnCopy.addEventListener('click', async () => {
    const text = resultContent.textContent;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      btnCopy.textContent = 'Copied!';
      setTimeout(() => { btnCopy.textContent = 'Copy'; }, 1800);
    } catch {
      btnCopy.textContent = 'Failed';
      setTimeout(() => { btnCopy.textContent = 'Copy'; }, 1800);
    }
  });

  // ── History ──
  function addHistory(text, type) {
    history.unshift({ text, type, ts: Date.now() });
    if (history.length > 20) history.pop();
    renderHistory();
  }

  function renderHistory() {
    historyList.innerHTML = '';
    if (history.length === 0) {
      historyList.appendChild(historyEmpty);
      historyEmpty.style.display = '';
      return;
    }
    history.forEach(item => {
      const el = document.createElement('div');
      el.className = 'history-item';
      el.innerHTML = `
        <span class="history-item-text">${sanitizeDisplay(item.text)}</span>
        <span class="history-item-type">${item.type}</span>
      `;
      el.addEventListener('click', () => showResult(item.text));
      historyList.appendChild(el);
    });
  }

  btnClearHistory.addEventListener('click', () => {
    history = [];
    renderHistory();
  });

  // ── Start scanning ──
  async function startScan() {
    if (scanning) return;
    if (!cachedStream) { setStatus('No camera available'); return; }

    // Clean up any previous reader
    if (codeReader) {
      try { codeReader._controls?.stop(); } catch {}
      codeReader = null;
    }

    try {
      // Re-enable tracks on the cached stream (no new permission prompt)
      cachedStream.getVideoTracks().forEach(t => { t.enabled = true; });

      // Attach stream directly to the video element
      video.srcObject = cachedStream;
      await video.play().catch(() => {});

      codeReader = new ZXing.BrowserQRCodeReader();
      scanning   = true;
      lastResult = '';

      idleOverlay.classList.add('hidden');
      viewfinderWrap.classList.add('scanning');
      setStatus('Scanning…');

      // Use decodeFromStream so ZXing never calls getUserMedia itself
      const controls = await codeReader.decodeFromStream(
        cachedStream,
        video,
        (result, err) => {
          if (!result) return;
          const text = result.getText();
          if (text === lastResult) return;
          lastResult = text;

          doFlash();
          showResult(text);
          setStatus('QR code detected');
        }
      );

      if (codeReader) codeReader._controls = controls;
    } catch (err) {
      scanning = false;
      codeReader = null;
      viewfinderWrap.classList.remove('scanning');
      idleOverlay.classList.remove('hidden');
      setStatus('Error: ' + (err.message || 'Could not start camera'));
      console.error(err);
    }
  }

  // ── Stop scanning ──
  // silent=true: just pause the camera, don't touch UI (caller handles it)
  function stopScan(silent = false) {
    if (!scanning) return;
    scanning = false;
    try {
      codeReader?._controls?.stop();
    } catch {}
    codeReader = null;
    // Disable tracks to turn off the camera indicator light,
    // but keep srcObject attached so re-enabling needs no new permission
    try {
      if (cachedStream) cachedStream.getVideoTracks().forEach(t => { t.enabled = false; });
    } catch {}
    viewfinderWrap.classList.remove('scanning');
    if (!silent) {
      idleOverlay.classList.remove('hidden');
      setStatus('Tap to scan');
    }
  }

  // Tap viewfinder to start
  viewfinderWrap.addEventListener('click', startScan);

  // Stop on page hide (tab switch, lock screen)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && scanning) stopScan();
  });

  // ── Init ──
  renderHistory();
  initCamera().then(startScan);

})();
</script>
</body>
</html>
